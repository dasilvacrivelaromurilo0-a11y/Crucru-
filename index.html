<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para você ♡</title>
<style>
  body{margin:0;background:#0f0a1a;color:white;font-family:Arial,sans-serif;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center}
  #stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .star{position:absolute;background:white;border-radius:50%;box-shadow:0 0 10px white;animation:cairGirando linear infinite}
  @keyframes cairGirando{0%{transform:translateY(-20px) rotate(0deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(110vh) translateX(80px) rotate(720deg);opacity:0}}
  .box{position:relative;z-index:5;background:rgba(30,20,45,0.85);border:1px solid rgba(255,180,255,0.5);padding:30px 20px;border-radius:20px;max-width:350px;width:85%;backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(255,150,255,0.4);text-align:center}
  .botoes{position:relative;width:100%;height:70px;margin-top:20px}
  
  button{padding:14px 28px;border:none;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer}
  #sim{background:#ffc6ff;color:#2a0a2a;position:absolute;left:50%;transform:translateX(-80px);transition:0.2s}
  #nao{
    background:#2a2a3a;color:white;border:1px solid #666;
    position:absolute;
    left:50%;
    transform:translateX(20px);
    /* ANIMAÇÃO SUAVE AQUI */
    transition: left 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), top 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    will-change: left, top;
  }
  #final{display:none;margin-top:20px}
  .confete{position:fixed;top:-10px;width:10px;height:14px;animation:confeteCai 3s linear forwards;z-index:20}
  @keyframes confeteCai{to{transform:translateY(100vh) rotate(720deg)}}
  #musicBtn{position:fixed;bottom:20px;right:20px;z-index:20;background:rgba(255,198,255,0.2);border:1px solid #ffc6ff;color:#ffc6ff;border-radius:50%;width:45px;height:45px}
</style>
</head>
<body>

<div id="stars"></div>
<button id="musicBtn">♪</button>

<div class="box">
  <h1>Oi amor ♡</h1>
  <div style="font-size:18px;margin:15px 0 10px 0">Você vai ficar comigo para sempre? 🥺</div>
  <div class="botoes" id="areaBotoes">
    <button id="sim">SIM ♡</button>
    <button id="nao">NÃO</button>
  </div>
  <div id="final"><h1>EU TE AMO!!! 💜</h1></div>
</div>

<script>
// ESTRELAS
for(let i=0;i<120;i++){let s=document.createElement('div');s.className='star';let sz=Math.random()*4+2;s.style.width=sz+'px';s.style.height=sz+'px';s.style.left=Math.random()*100+'vw';s.style.animationDuration=(Math.random()*3+2)+'s';s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').appendChild(s);}

// MUSICA
let audioCtx, tocando=false;
function iniciarMusica(){if(tocando)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();tocando=true;function tocarNota(f,t){let o=audioCtx.createOscillator(),g=audioCtx.createGain(),fl=audioCtx.createBiquadFilter();o.type='triangle';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=800;g.gain.setValueAtTime(0,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0.15,audioCtx.currentTime+0.5);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+t);o.connect(fl);fl.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+t);}let notas=[261.63,329.63,392,440,392,329.63,293.66,329.63],j=0;setInterval(()=>{tocarNota(notas[j%notas.length],3);if(j%3==0)tocarNota(notas[j%notas.length]/2,4);j++;},1200);}
document.body.addEventListener('click', iniciarMusica, {once:true});

// BOTÃO NÃO - AGORA 100% SUAVE E NUNCA SOME
const btnNao = document.getElementById('nao');
let jaSaiuDoBox = false;

function fugir(e){
  e.preventDefault();

  if(!jaSaiuDoBox){
    // Pega onde ele está e transforma em FIXED sem sumir
    const rect = btnNao.getBoundingClientRect();
    btnNao.style.position = 'fixed';
    btnNao.style.left = rect.left + 'px';
    btnNao.style.top = rect.top + 'px';
    btnNao.style.transform = 'none';
    jaSaiuDoBox = true;
    
    // Força o navegador a aplicar antes de mover
    btnNao.offsetHeight; 
  }

  // Próxima posição aleatória com margem pra não sair da tela
  const padding = 20;
  const novaX = Math.random() * (window.innerWidth - btnNao.offsetWidth - padding*2) + padding;
  const novaY = Math.random() * (window.innerHeight - btnNao.offsetHeight - padding*2) + padding;
  
  btnNao.style.left = novaX + 'px';
  btnNao.style.top = novaY + 'px';
}

btnNao.addEventListener('mouseenter', fugir);
btnNao.addEventListener('click', fugir);
btnNao.addEventListener('touchstart', fugir, {passive:false});

// BOTÃO SIM
document.getElementById('sim').addEventListener('click', ()=>{
  iniciarMusica();
  document.getElementById('areaBotoes').style.display='none';
  document.getElementById('final').style.display='block';
  for(let i=0;i<200;i++){let c=document.createElement('div');c.className='confete';c.style.left=Math.random()*100+'vw';c.style.background=['#ffc6ff','#ff8fab','#fff','#a78bfa'][Math.floor(Math.random()*4)];c.style.animationDelay=Math.random()*0.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000);}
});
</script>
</body>
</html>
