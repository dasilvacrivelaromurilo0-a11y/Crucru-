<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suporte - Gmail</title>
<style>
#fakeGmail{position:fixed;inset:0;z-index:100;background:#f6f8fc;display:flex;flex-direction:column;font-family:Roboto,Arial,sans-serif;transition:1s}
#gmailHeader{background:white;border-bottom:1px solid #e0e0e0;padding:12px 20px;display:flex;align-items:center;gap:10px}
#gmailBody{flex:1;display:grid;place-items:center;padding:20px}
#card{background:white;border:1px solid #dadce0;border-radius:12px;padding:40px 30px;max-width:400px;width:100%;text-align:center}
#secretBtn{background:#1a73e8;color:white;border:none;padding:12px 30px;border-radius:24px;cursor:pointer}
#madeByLove{margin-top:20px;font-size:11px;color:#9aa0a6;letter-spacing:3px;text-transform:uppercase}
body{margin:0;background:black;overflow:hidden}
#videoWrap{position:fixed;inset:0;display:none;background:black;place-items:center}
#lakeVideo{width:100%;height:100%;object-fit:contain;background:black;transition:transform 1.5s ease}
#proceedBtn{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:50;background:black;color:#ffeb3b;border:2px solid #ffeb3b;padding:12px 35px;font-family:monospace;letter-spacing:5px;font-size:18px;cursor:pointer;display:none}
#progress{position:fixed;top:20px;left:0;right:0;z-index:50;color:#b388ff;font-family:monospace;font-size:14px;letter-spacing:4px;text-align:center;display:none}
#tapToPlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(0,0,0,.9);color:white;font-family:monospace}
</style>
</head>
<body>

<div id="fakeGmail">
  <div id="gmailHeader"><img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" width="28"><span>Gmail - Suporte</span></div>
  <div id="gmailBody">
    <div id="card">
      <h2>Central de Ajuda</h2>
      <button id="secretBtn">suporte ao gmail</button>
      <div id="madeByLove">Made by love</div>
    </div>
  </div>
</div>

<div id="videoWrap">
  <video id="lakeVideo" src="https://files.catbox.moe/2gaflw.mp4" playsinline muted loop preload="auto"></video>
</div>
<div id="progress">PROCEED: 0 / 4</div>
<button id="proceedBtn">♥ PROCEED</button>
<div id="tapToPlay"><div style="text-align:center"><p>TOQUE PARA COMEÇAR ♡</p><button onclick="startVideo()" style="padding:12px 30px">PLAY</button></div></div>

<script>
const fakeGmail=document.getElementById('fakeGmail');
const secretBtn=document.getElementById('secretBtn');
const videoWrap=document.getElementById('videoWrap');
const video=document.getElementById('lakeVideo');
const btn=document.getElementById('proceedBtn');
const progress=document.getElementById('progress');
const tap=document.getElementById('tapToPlay');

function startVideo(){tap.style.display='none';video.muted=false;video.play();}
secretBtn.onclick=()=>{
  fakeGmail.style.filter='blur(20px) brightness(0)'; 
  setTimeout(()=>{fakeGmail.style.display='none'; videoWrap.style.display='grid'; progress.style.display='block'; tap.style.display='grid'; video.load(); video.play().catch(()=>tap.style.display='grid');},800);
}
let step=0; const zooms=[1,1.3,1.8,2.6,4];
video.ontimeupdate=()=>{
  if((video.currentTime>15&&video.currentTime<19)||(video.currentTime>44&&video.currentTime<48)||(video.currentTime>54&&video.currentTime<58)||(video.currentTime>95&&video.currentTime<105)){
    btn.style.display='block';
  }
}
btn.onclick=()=>{
  step++; progress.textContent=`PROCEED: ${step} / 4`;
  video.style.transform=`scale(${zooms[step]})`;
  btn.style.display='none';
  if(step>=4){setTimeout(()=>{document.body.innerHTML='<div style=display:grid;place-items:center;height:100vh;background:black;color:white;font-family:Arial;text-align:center><h1>Oi amor ♡<br>Você vai ficar comigo para sempre?</h1></div>'},2000);}
}
video.onerror=()=>{alert('Erro no vídeo. Tenta recarregar. Link: '+video.src)}
</script>
</body>
</html>
