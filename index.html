<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para você ♡</title>
<style>
  body{margin:0;background:#0f0a1a;color:white;font-family:Arial,sans-serif;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .star{position:absolute;background:white;border-radius:50%;box-shadow:0 0 8px white;animation:cairGirando linear infinite}
  @keyframes cairGirando{
    0%{transform:translateY(-20px) rotate(0deg);opacity:0}
    10%{opacity:1} 90%{opacity:1}
    100%{transform:translateY(110vh) translateX(80px) rotate(720deg);opacity:0}
  }
  .box{position:relative;z-index:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,180,255,0.4);padding:35px 20px;border-radius:20px;max-width:380px;margin:20px;backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(255,150,255,0.3);text-align:center}
  h1{color:#ffc6ff;margin:5px 0 10px 0;font-size:22px}
  .pergunta{font-size:18px;margin:15px 0 20px 0}
  .botoes{display:flex;justify-content:center;gap:15px;position:relative;height:60px}
  button{padding:12px 26px;border:none;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer;transition:0.2s}
  #sim{background:#ffc6ff;color:#2a0a2a}
  #nao{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);position:absolute;left:200px}
  #final{display:none;margin-top:20px;animation:fade 1s}
  @keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1}}
  .confete{position:fixed;top:-10px;width:10px;height:10px;animation:confeteCai linear forwards;z-index:10}
  @keyframes confeteCai{to{transform:translateY(100vh) rotate(720deg)}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="box" id="box">
  <h1 id="titulo">Oi amor ♡</h1>
  <p style="opacity:0.8;font-size:14px;">Eu tenho uma coisinha pra te perguntar...</p>
  
  <div class="pergunta" id="pergunta">Você vai ficar comigo para sempre? 🥺</div>

  <div class="botoes">
    <button id="sim" onclick="aceitou()">SIM ♡</button>
    <button id="nao" onmouseover="fugir()" ontouchstart="fugir()">NÃO</button>
  </div>

  <div id="final">
    <h1 style="font-size:32px;">EU TE AMO!!! 💜
