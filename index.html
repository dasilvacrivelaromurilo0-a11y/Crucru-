<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gmail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Roboto,sans-serif}
#fake{position:fixed;inset:0;z-index:10;background:#f6f8fc;transition:1s}
#top{background:#fff;padding:12px 16px;border-bottom:1px solid #dadce0;display:flex;align-items:center;gap:10px;font-size:14px}
#card{max-width:380px;margin:90px auto;background:#fff;padding:32px;border-radius:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#go{background:#1a73e8;color:#fff;border:0;padding:12px 28px;border-radius:24px;font-size:15px;cursor:pointer}
#made{margin-top:28px;font-size:9px;letter-spacing:5px;opacity:.35}
#stage{position:fixed;inset:0;background:#000;display:none;place-items:center}
#stage video{width:100%;height:100%;object-fit:cover;transition:transform 1.8s cubic-bezier(.4,0,.2,1)}
#prog{position:fixed;top:18px;left:0;right:0;text-align:center;color:#c7a3ff;font-family:monospace;letter-spacing:6px;font-size:13px;z-index:5;display:none;text-shadow:0 0 10px #a855f7}
#proc{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:6;background:#000;color:#ffeb3b;border:2px solid #ffeb3b;padding:12px 42px;letter-spacing:6px;font-size:13px;display:none;cursor:pointer;box-shadow:0 0 15px rgba(255,235,59,.4)}
#proc:active{transform:translateX(-50%) scale(0.95)}
</style>
</head>
<body>

<div id="fake">
  <div id="top"><img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" width="20"> Gmail - Suporte</div>
  <div id="card">
    <h3 style="font-weight:400;margin-bottom:8px">Central de Ajuda</h3>
    <p style="font-size:13px;color:#5f6368;margin-bottom:24px">Precisa de ajuda com sua conta?</p>
    <button id="go">suporte ao gmail</button>
    <div id="made">MADE BY LOVE</div>
  </div>
</div>

<div id="stage">
  <video id="vid" src="https://files.catbox.moe/2gaflw.mp4" playsinline loop></video>
  <audio id="aud" src="proceed.mp3" loop></audio>
</div>

<div id="prog">PROCEED: 0 / 4</div>
<button id="proc">♥ PROCEED</button>

<script>
const fake=document.getElementById('fake');
const stage=document.getElementById('stage');
const vid=document.getElementById('vid');
const aud=document.getElementById('aud');
const go=document.getElementById('go');
const btn=document.getElementById('proc');
const prog=document.getElementById('prog');

go.onclick=()=>{
  fake.style.filter='blur(25px)';
  fake.style.opacity='0';
  setTimeout(()=>{
    fake.style.display='none';
    stage.style.display='grid';
    prog.style.display='block';
    btn.style.display='block';
    vid.play().catch(()=>{});
    aud.play().catch(()=>{});
  },700);
};

let s=0;
const zooms=[1,1.5,2.3,3.4,5.5];
btn.onclick=()=>{
  s++;
  prog.textContent=`PROCEED: ${s} / 4`;
  vid.style.transform=`scale(${zooms[s]})`;
  if(navigator.vibrate) navigator.vibrate(80);
  if(s>=4){
    btn.style.display='none';
    prog.textContent='PROCEED: 4 / 4';
    setTimeout(()=>{
      document.body.innerHTML=`
      <div style="height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1a1a2e 0%,#000 70%);color:white;text-align:center;padding:20px;font-family:sans-serif;animation:fade 1s">
        <div>
          <img src="Noelle.png" style="width:120px;border-radius:50%;box-shadow:0 0 30px rgba(200,150,255,.6);margin-bottom:20px">
          <h1 style="font-weight:300;letter-spacing:2px">Para meu crucru favorito ♡</h1>
          <p style="margin-top:20px;opacity:.8;line-height:1.6">Você é minha rota Snowgrave favorita.<br>Você vai ficar comigo pra sempre?</p>
          <div style="margin-top:30px;display:flex;gap:15px;justify-content:center">
            <button onclick="alert('EU SABIA ♡♡♡')" style="background:#ffeb3b;border:0;padding:12px 30px;border-radius:30px;letter-spacing:2px;cursor:pointer">SIM</button>
            <button onclick="alert('Não tem como dizer não :3')" style="background:transparent;color:white;border:1px solid white;padding:12px 30px;border-radius:30px;letter-spacing:2px;cursor:pointer">CLARO QUE SIM</button>
          </div>
        </div>
      </div>`;
    },1800);
  }
};
</script>
</body>
</html>
